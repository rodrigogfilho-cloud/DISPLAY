 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/style.css">
    <title>Projeto - Natura</title>
 </head>
 <body>
    <section class="brands">

        <div class="brands__title">
            <h1 >conheça nossas marcas</h1>
        </div>

        <div class="brands__grid">
            
            <!-- CARD KAIAK -->
             <article class="brand-card">
                <div class="brand-card__image">
                    <img src="./img/logo-kaiak.png" alt="Imagem da logo dos produtos Kaiak da Natura">
                </div>
                <h2 class="brand-card__title">Kaiak</h2>
                <p class="brand-card__description">fragrâncias aromáticas para quem busca todo o frescor do mar</p>
                <button class="brand-card__button">conhecer</button>
             </article>

            <!-- CARD ESSENCIAL -->
             <article class="brand-card">
                <div class="brand-card__image">
                    <span>IMAGEM</span>
                </div>
                <h2 class="brand-card__title">Essencial</h2>
                <p class="brand-card__description">fragrâncias sofisticadas com ingredientes da perfumaria mundial e biodiversidade brasileira</p>
                <button class="brand-card__button">conhecer</button>
             </article>

            <!-- CARD LUNA -->
             <article class="brand-card">
                <div class="brand-card__image">
                    <span>IMAGEM</span>
                </div>
                <h2 class="brand-card__title">Luna</h2>
                <p class="brand-card__description">criações autênticas e marcantes com o exclusivo chipre Natura</p>
                <button class="brand-card__button">conhecer</button>
             </article>

        </div>
    </section>
 </body>
 </html>
